plugins {
    id 'com.android.application'
}
android {
    namespace 'com.litetube.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.litetube.tv'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    signingConfigs {
        release {
            def storeFilePath = System.getenv('LITETUBE_KEYSTORE_PATH')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv('LITETUBE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LITETUBE_KEY_ALIAS')
                keyPassword System.getenv('LITETUBE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('LITETUBE_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
